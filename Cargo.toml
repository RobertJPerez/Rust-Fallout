[workspace]
members = ["crates/fallout-data", "crates/fallout-runtime", "crates/fallout-cli", "crates/fallout-preview", "tools/archive-compare"]
default-members = ["crates/fallout-cli", "crates/fallout-data", "crates/fallout-runtime"]
resolver = "3"
exclude = ["tools/plugin-oracle"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10.9"
getrandom = "=0.4.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
adler2 = "=2.0.1"
dream_archive = { git = "https://github.com/DreamWeave-MP/dream_archive", rev = "a6ba4c9416e5c7bc211e7a3762420e5bf5c9c049", default-features = false, features = ["bsa-tes4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep source validation usable in the inspection build. Full plugin scans and
# archive hashing run before the first window; unoptimized loops make that wait long.
[profile.dev.package.fallout-data]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 3

