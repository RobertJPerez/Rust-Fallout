[package]
name = "fallout-cli"
default-run = "fallout"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fallout"
path = "src/main.rs"

[[bin]]
name = "fallout-evidence"
path = "src/evidence.rs"

[dependencies]
fallout-data = { path = "../fallout-data" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true

