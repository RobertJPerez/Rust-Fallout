[package]
name = "fallout-preview"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fallout-data = { path = "../fallout-data" }
bevy = { version = "=0.19.1", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
    "bevy_winit", "bevy_pbr", "bevy_core_pipeline", "bevy_gilrs", "png", "dds",
] }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
quick-xml = { version = "=0.42.0", default-features = false }

[lints]
workspace = true

